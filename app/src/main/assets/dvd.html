<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>DVD Screensaver</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #dvd {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    pointer-events: none;

    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  #message {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;

    color: #ff8080;
    font: 16px/1.5 sans-serif;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    pointer-events: none;
  }
</style>
</head>

<body>

<canvas id="dvd"></canvas>
<div id="message"></div>

<script>
(() => {
  "use strict";

  // ===== НАСТРОЙКИ =====

  const SPEED = 150;          // Скорость: CSS-пиксели в секунду.
  const WIDTH_RATIO = 0.30;   // Ширина логотипа относительно экрана.
  const MAX_HEIGHT_RATIO = 0.35;

  const COLORS = [
    "#00ffff",
    "#ff00ff",
    "#ffff00",
    "#00ff66",
    "#ff5533",
    "#4488ff",
    "#ff88cc",
    "#ffffff"
  ];

  // ===== ЭЛЕМЕНТЫ И СОСТОЯНИЕ =====

  const canvas = document.getElementById("dvd");
  const message = document.getElementById("message");
  const ctx = canvas.getContext("2d");

  const image = new Image();

  const axisX = { position: 20, velocity: SPEED * 0.8 };
  const axisY = { position: 40, velocity: SPEED * 0.6 };

  let logoWidth = 0;
  let logoHeight = 0;
  let limitX = 0;
  let limitY = 0;

  let colorIndex = 0;
  let ready = false;
  let exiting = false;

  let previousTime = null;
  let animationId = null;

  function showMessage(text) {
    message.textContent = text;
  }

  // ===== ВЫХОД ПО КАСАНИЮ =====

  function exitScreensaver(event) {
    if (event && event.cancelable) {
      event.preventDefault();
    }

    if (exiting) return;

    try {
      if (
        window.AndroidBridge &&
        typeof window.AndroidBridge.exitScreensaver === "function"
      ) {
        window.AndroidBridge.exitScreensaver();

        exiting = true;
        stopAnimation();
        return;
      }

      showMessage(
        "Выход по касанию доступен внутри Android-заставки.
" +
        "В обычном браузере AndroidBridge отсутствует."
      );
    } catch (error) {
      showMessage(
        "Не удалось завершить заставку:
" +
        String(error)
      );
    }
  }

  if ("PointerEvent" in window) {
    window.addEventListener(
      "pointerdown",
      exitScreensaver,
      { capture: true, passive: false }
    );
  } else {
    window.addEventListener(
      "touchstart",
      exitScreensaver,
      { capture: true, passive: false }
    );

    window.addEventListener(
      "mousedown",
      exitScreensaver,
      { capture: true }
    );
  }

  window.addEventListener("contextmenu", event => {
    event.preventDefault();
  });

  // ===== РИСОВАНИЕ И ПЕРЕКРАШИВАНИЕ =====

  function paintLogo() {
    if (!ready || !ctx) return;

    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // Цвет накладывается только на непрозрачные части PNG.
    ctx.globalCompositeOperation = "source-in";
    ctx.fillStyle = COLORS[colorIndex];
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = "source-over";
  }

  function changeColor() {
    const offset =
      1 + Math.floor(Math.random() * (COLORS.length - 1));

    colorIndex = (colorIndex + offset) % COLORS.length;

    paintLogo();
  }

  function updateTransform() {
    canvas.style.transform =
      `translate3d(${axisX.position}px, ${axisY.position}px, 0)`;
  }

  // ===== РАЗМЕРЫ =====

  function resize() {
    if (!ready) return;

    const screenWidth = Math.max(1, window.innerWidth);
    const screenHeight = Math.max(1, window.innerHeight);

    const aspect = image.naturalWidth / image.naturalHeight;

    logoWidth = Math.min(
      screenWidth * WIDTH_RATIO,
      screenHeight * MAX_HEIGHT_RATIO * aspect
    );

    logoHeight = logoWidth / aspect;

    canvas.style.width = logoWidth + "px";
    canvas.style.height = logoHeight + "px";

    // Ограничиваем разрешение маленького canvas:
    // это не полноэкранный буфер.
    const scale = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(logoWidth * scale));
    canvas.height = Math.max(1, Math.round(logoHeight * scale));

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    limitX = Math.max(0, screenWidth - logoWidth);
    limitY = Math.max(0, screenHeight - logoHeight);

    axisX.position = Math.max(
      0,
      Math.min(axisX.position, limitX)
    );

    axisY.position = Math.max(
      0,
      Math.min(axisY.position, limitY)
    );

    previousTime = null;

    paintLogo();
    updateTransform();
  }

  // ===== ДВИЖЕНИЕ И ОТРАЖЕНИЯ =====

  function advanceAxis(axis, limit, dt) {
    if (limit <= 0) {
      axis.position = 0;
      return false;
    }

    axis.position += axis.velocity * dt;

    let collided = false;

    // Сохраняем перемещение, оставшееся после удара.
    // Это исключает короткую "остановку" у границы.
    while (axis.position < 0 || axis.position > limit) {
      if (axis.position < 0) {
        axis.position = -axis.position;
        axis.velocity = Math.abs(axis.velocity);
      } else {
        axis.position = 2 * limit - axis.position;
        axis.velocity = -Math.abs(axis.velocity);
      }

      collided = true;
    }

    if (axis.position === 0 && axis.velocity < 0) {
      axis.velocity = Math.abs(axis.velocity);
      collided = true;
    } else if (
      axis.position === limit &&
      axis.velocity > 0
    ) {
      axis.velocity = -Math.abs(axis.velocity);
      collided = true;
    }

    return collided;
  }

  function frame(time) {
    animationId = null;

    if (!ready || exiting || document.hidden) return;

    if (previousTime !== null) {
      const elapsed = (time - previousTime) / 1000;

      // После длительной паузы не делаем огромный скачок.
      // Обычные интервалы кадров обрабатываем полностью.
      const dt = Math.max(0, Math.min(elapsed, 0.1));

      const hitX = advanceAxis(axisX, limitX, dt);
      const hitY = advanceAxis(axisY, limitY, dt);

      if (hitX || hitY) {
        changeColor();
      }
    }

    previousTime = time;

    updateTransform();

    animationId = requestAnimationFrame(frame);
  }

  function startAnimation() {
    if (
      !ready ||
      exiting ||
      document.hidden ||
      animationId !== null
    ) {
      return;
    }

    previousTime = null;
    animationId = requestAnimationFrame(frame);
  }

  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    previousTime = null;
  }

  // ===== СОБЫТИЯ СТРАНИЦЫ =====

  window.addEventListener("resize", resize);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopAnimation();
    } else {
      startAnimation();
    }
  });

  window.addEventListener("pagehide", stopAnimation);
  window.addEventListener("pageshow", startAnimation);

  window.addEventListener("error", event => {
    showMessage(
      "Ошибка JavaScript:
" +
      (event.message || "Неизвестная ошибка")
    );
  });

  // ===== ЗАГРУЗКА PNG =====

  if (!ctx) {
    showMessage("WebView не смог создать Canvas 2D.");
    return;
  }

  image.onload = () => {
    if (!image.naturalWidth || !image.naturalHeight) {
      showMessage("У dvd.png некорректные размеры.");
      return;
    }

    ready = true;
    showMessage("");

    resize();
    startAnimation();
  };

  image.onerror = () => {
    showMessage(
      "Не удалось загрузить dvd.png.
" +
      "Файл должен лежать рядом с dvd.html внутри assets."
    );
  };

  image.src = "dvd.png";
})();
</script>

</body>
</html>
